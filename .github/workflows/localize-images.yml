name: Localize SCHRAGE images

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/localize-images.yml"

permissions:
  contents: write

jobs:
  localize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download original SCHRAGE images
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/images

          download() {
            url="$1"
            out="$2"
            echo "Downloading $out"
            curl -A "Mozilla/5.0" -L --fail --show-error --silent \
              --retry 4 --retry-delay 2 --retry-all-errors \
              "$url" -o "assets/images/$out"
            test -s "assets/images/$out"
          }

          download "https://schrage-metallspritz.de/wp-content/uploads/2025/08/Schnecke-1080x675.jpg" "schnecke.jpg"
          download "https://schrage-anlagenbau.de/wp-content/uploads/2025/02/Schrage_AB_RKF300-scaled.jpg" "rkf300.jpg"
          download "https://schrage-metallspritz.de/wp-content/uploads/2025/08/HVOF-Beschichtung_Luefterrad-1.jpg" "hvof-luefterrad.jpg"
          download "https://schrage-anlagenbau.de/wp-content/uploads/2021/01/schrage-home-header.jpg" "conveying-hero.jpg"
          download "https://schrage-metallspritz.de/wp-content/uploads/2024/11/Header_neu_CNC_241129.jpg" "cnc-seiger.jpg"
          download "https://schrage-metallspritz.de/wp-content/uploads/2025/09/Schuette-scaled.jpg" "schuette.jpg"
          download "https://schrage-metallspritz.de/wp-content/uploads/2025/08/IMG_6642-scaled.jpeg" "img-6642.jpeg"
          download "https://schrage-metallspritz.de/wp-content/uploads/2024/11/Header_neu_carussel_241129.jpg" "karussell.jpg"
          download "https://schrage-metallspritz.de/wp-content/uploads/2024/12/Header_neu_Maschine1_241202.jpg" "maschine1.jpg"
          download "https://schrage-anlagenbau.de/wp-content/uploads/2021/01/schrage-schneckenfoerderer-header.jpg" "schneckenfoerderer-hero.jpg"
          download "https://schrage-anlagenbau.de/wp-content/uploads/2021/01/schneckenfoerderer-sonderformen-beispiele.jpg" "schneckenfoerderer-sonderformen.jpg"
          download "https://schrage-metallspritz.de/wp-content/uploads/2023/12/CA2_7859-Schrage-WeSta-scaled.jpg" "weitere-maschine.jpg"
          download "https://schrage-metallspritz.de/wp-content/uploads/2025/08/SCHRAGE_GF_2025.jpg" "geschaeftsfuehrung.jpg"
          download "https://schrage-metallspritz.de/wp-content/uploads/2025/08/Heide-mit-Zellradschleuse_6596.jpeg" "heide-zellradschleuse.jpeg"
          download "https://schrage-metallspritz.de/wp-content/uploads/2025/08/IMG_6591-scaled.jpeg" "img-6591.jpeg"

          file assets/images/*

      - name: Replace external image URLs with local assets
        shell: python
        run: |
          from pathlib import Path

          mapping = {
            "https://schrage-metallspritz.de/wp-content/uploads/2025/08/Schnecke-1080x675.jpg": "assets/images/schnecke.jpg",
            "https://schrage-anlagenbau.de/wp-content/uploads/2025/02/Schrage_AB_RKF300-scaled.jpg": "assets/images/rkf300.jpg",
            "https://schrage-metallspritz.de/wp-content/uploads/2025/08/HVOF-Beschichtung_Luefterrad-1.jpg": "assets/images/hvof-luefterrad.jpg",
            "https://schrage-anlagenbau.de/wp-content/uploads/2021/01/schrage-home-header.jpg": "assets/images/conveying-hero.jpg",
            "https://schrage-metallspritz.de/wp-content/uploads/2024/11/Header_neu_CNC_241129.jpg": "assets/images/cnc-seiger.jpg",
            "https://schrage-metallspritz.de/wp-content/uploads/2025/09/Schuette-scaled.jpg": "assets/images/schuette.jpg",
            "https://schrage-metallspritz.de/wp-content/uploads/2025/08/IMG_6642-scaled.jpeg": "assets/images/img-6642.jpeg",
            "https://schrage-metallspritz.de/wp-content/uploads/2024/11/Header_neu_carussel_241129.jpg": "assets/images/karussell.jpg",
            "https://schrage-metallspritz.de/wp-content/uploads/2024/12/Header_neu_Maschine1_241202.jpg": "assets/images/maschine1.jpg",
            "https://schrage-anlagenbau.de/wp-content/uploads/2021/01/schrage-schneckenfoerderer-header.jpg": "assets/images/schneckenfoerderer-hero.jpg",
            "https://schrage-anlagenbau.de/wp-content/uploads/2021/01/schneckenfoerderer-sonderformen-beispiele.jpg": "assets/images/schneckenfoerderer-sonderformen.jpg",
            "https://schrage-metallspritz.de/wp-content/uploads/2023/12/CA2_7859-Schrage-WeSta-scaled.jpg": "assets/images/weitere-maschine.jpg",
            "https://schrage-metallspritz.de/wp-content/uploads/2025/08/SCHRAGE_GF_2025.jpg": "assets/images/geschaeftsfuehrung.jpg",
            "https://schrage-metallspritz.de/wp-content/uploads/2025/08/Heide-mit-Zellradschleuse_6596.jpeg": "assets/images/heide-zellradschleuse.jpeg",
            "https://schrage-metallspritz.de/wp-content/uploads/2025/08/IMG_6591-scaled.jpeg": "assets/images/img-6591.jpeg",
          }

          html_files = list(Path(".").glob("*.html"))
          for path in html_files:
              text = path.read_text(encoding="utf-8")
              before = text
              for old, new in mapping.items():
                  text = text.replace(old, new)
              if text != before:
                  path.write_text(text, encoding="utf-8")
                  print("Updated", path)

      - name: Verify local assets
        shell: bash
        run: |
          set -euo pipefail
          count="$(find assets/images -type f | wc -l)"
          test "$count" -eq 15
          if grep -R "https://schrage-.*wp-content/uploads" --include="*.html" .; then
            echo "External SCHRAGE image URLs remain in HTML"
            exit 1
          fi

      - name: Commit localized assets
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/localize-images.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images *.html .github/workflows/localize-images.yml
          git commit -m "Localize SCHRAGE image assets"
          git push origin HEAD:main
